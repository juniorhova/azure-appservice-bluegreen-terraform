name: Application

on:
  pull_request:
    branches-ignore:
      - "docs/**"
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  push:
    branches-ignore:
      - "docs/**"
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: app
  PACKAGE_PATH: app-release.zip
  STAGING_SLOT_NAME: staging

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Test application
        working-directory: ${{ env.APP_DIR }}
        run: npm test

  deploy:
    name: Deploy to staging and swap
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write # Required for GitHub OIDC federation to Azure. No long-lived publish profile or client secret is stored.
    environment:
      name: azure-dev-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --omit=dev

      - name: Package application
        run: |
          cd "$APP_DIR"
          zip -r "../$PACKAGE_PATH" . -x "node_modules/.cache/*"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.STAGING_SLOT_NAME }}
          package: ${{ env.PACKAGE_PATH }}

      - name: Smoke test staging slot
        run: |
          for attempt in {1..12}; do
            status_code=$(curl --silent --show-error --output /tmp/health.json --write-out "%{http_code}" "${{ vars.AZURE_STAGING_URL }}/health")

            if [ "$status_code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi

            echo "Smoke test attempt ${attempt} failed with HTTP ${status_code}. Retrying..."
            sleep 10
          done

          echo "Staging smoke test failed."
          cat /tmp/health.json || true
          exit 1

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --slot "$STAGING_SLOT_NAME" \
            --target-slot production

      - name: Smoke test production slot
        run: |
          curl --fail --silent --show-error "${{ vars.AZURE_PRODUCTION_URL }}/health"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Application deployment"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Web app: \`${{ vars.AZURE_WEBAPP_NAME }}\`"
            echo "- Staging slot: \`${{ env.STAGING_SLOT_NAME }}\`"
            echo "- Staging URL: ${{ vars.AZURE_STAGING_URL }}"
            echo "- Production URL: ${{ vars.AZURE_PRODUCTION_URL }}"
            echo ""
            echo "The production swap runs only after application tests and staging smoke tests pass."
          } >> "$GITHUB_STEP_SUMMARY"
